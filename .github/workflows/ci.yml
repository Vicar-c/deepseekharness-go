name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      # The tool batch scheduler runs tool calls in goroutines; the race detector
      # needs cgo, which is only preinstalled on the Linux runner.
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test ./... -count=1 -race

      - name: go build
        run: go build ./cmd/dsh

      # Documentation is part of the increment (AGENTS.md §1.14 / D-0008): broken
      # relative links fail the build, and the README inventory is covered by
      # `go test ./cmd/dsh` above.
      - name: markdown links
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f scripts/check_md_links.py ]; then
            python3 scripts/check_md_links.py
          fi

  webui:
    name: webui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /usr/bin/google-chrome
          - os: windows-latest
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build dsh
        shell: bash
        run: go build -o bin/dsh$( [ "$RUNNER_OS" = "Windows" ] && echo .exe ) ./cmd/dsh

      - name: browser end-to-end
        shell: bash
        run: |
          dsh="./bin/dsh"; [ "$RUNNER_OS" = "Windows" ] && dsh="./bin/dsh.exe"
          node scripts/webui-e2e.mjs --dsh "$dsh" --chrome "${{ matrix.chrome }}"
